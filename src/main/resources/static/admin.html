<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card p-5">
            <h1 class="mb-4">Admin Side</h1>
            <p class="lead mb-5">{{message}}</p>
            
            <div class="mb-4 text-start p-4 border rounded bg-light">
                <h4>Bulk Upload Customers</h4>
                <p class="text-muted small">Upload an Excel (.xlsx) file containing customer details.</p>
                <div class="input-group">
                    <input type="file" class="form-control" id="excelFile" accept=".xlsx, .xls">
                    <button class="btn btn-success" type="button" ng-click="uploadExcel()">Upload</button>
                </div>
            </div>

            <div class="d-grid shadow-sm">
                <a href="#!/" class="btn btn-outline-primary">Back to Home</a>
            </div>
        </div>
    </div>
</div>
