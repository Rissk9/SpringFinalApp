<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Customer Details</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .status-active { color: green; font-weight: bold; }
        .status-inactive { color: red; font-weight: bold; }
        .btn-back {
            display: inline-block;
            padding: 10px 20px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn-back:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="margin: 0;">Customer Details Administration</h1>
            <a href="/" class="btn-back">Back to Home</a>
        </div>

        <div style="margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; background-color: #f9f9f9; border-radius: 5px;">
            <h3 style="margin-top: 0; color: #333;">Bulk Upload Customers</h3>
            <form id="bulkUploadForm">
                <input type="file" id="excelFile" name="file" accept=".xlsx, .xls" required style="margin-right: 10px; padding: 5px;">
                <button type="submit" style="padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Upload Excel</button>
            </form>
            <script>
                document.getElementById('bulkUploadForm').addEventListener('submit', function(e) {
                    e.preventDefault();
                    var fileInput = document.getElementById('excelFile');
                    var formData = new FormData();
                    formData.append('file', fileInput.files[0]);
                    
                    fetch('/api/customers/upload', {
                        method: 'POST',
                        body: formData
                    })
                    .then(response => {
                        if (response.status === 200) {
                            alert('Bulk upload successful!');
                            window.location.reload();
                        } else if (response.status === 207) {
                            return response.json().then(errs => {
                                alert('Upload finished with errors:\\n' + errs.slice(0,5).join('\\n'));
                                window.location.reload();
                            });
                        } else {
                            alert('Upload failed with status ' + response.status);
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('Upload error');
                    });
                });
            </script>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Gender</th>
                    <th>Date</th>
                    <th>Language</th>
                    <th>Country</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="customer : ${customers}">
                    <td th:text="${customer.custId}">1</td>
                    <td th:text="${customer.custFullname}">John Doe</td>
                    <td th:text="${customer.custGender}">Male</td>
                    <td th:text="${customer.custDate}">2023-01-01</td>
                    <td th:text="${customer.custPrefLanguage}">English</td>
                    <td th:text="${customer.custCountry}">USA</td>
                    <td th:text="${customer.custStatus}" th:classappend="${customer.custStatus != null && customer.custStatus.equalsIgnoreCase('Active') ? 'status-active' : 'status-inactive'}">Active</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
